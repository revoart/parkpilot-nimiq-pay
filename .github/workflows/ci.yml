name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 runs the operator tooling in scripts/ directly: type stripping
      # landed in 22.18, so an older Node cannot execute the .ts files there.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # First, and deliberately before anything else: a committed treasury key
      # is the one failure that cannot be undone by a later commit.
      - name: Check for committed secrets
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # Placeholder values only. CI never deploys; Vercel supplies the real
      # VITE_* variables at build time.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_PLATFORM_PAYMENT_ADDRESS: '0x0000000000000000000000000000000000000000'
          VITE_APP_MODE: production
